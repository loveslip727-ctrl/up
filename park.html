<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공원 청소물품 배부 일정 (10/1)</title>
<style>
:root{--bg:#f6f8f5;--card:#fff;--text:#1f2a24;--muted:#5f6d65;--accent:#2e7d4f;--line:#dfe6e0;--warn-bg:#fff6dd;--warn-text:#6b4e00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a16;--card:#1d251f;--text:#e8efe9;--muted:#9bab9f;--accent:#5cc487;--line:#2c382f;--warn-bg:#3a2f0f;--warn-text:#f3d98a}}
:root[data-theme="dark"]{--bg:#141a16;--card:#1d251f;--text:#e8efe9;--muted:#9bab9f;--accent:#5cc487;--line:#2c382f;--warn-bg:#3a2f0f;--warn-text:#f3d98a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:1.35rem;margin:0 0 4px}
.date{color:var(--muted);margin:0 0 16px}
.notice{background:var(--warn-bg);color:var(--warn-text);border-radius:10px;padding:12px 14px;font-weight:600;margin-bottom:18px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}
h2{margin:0;padding:12px 16px;font-size:1rem;color:var(--accent);border-bottom:1px solid var(--line)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
time{font-variant-numeric:tabular-nums;font-weight:700;min-width:3.6em;color:var(--accent)}
footer{color:var(--muted);font-size:.85rem;text-align:center;margin-top:8px}
</style>
</head>
<body>
<main>
  <h1>🌳 공원 청소물품 배부 일정</h1>
  <p class="date">2026년 10월 1일 (목)</p>
  <div class="notice">※ 위 시간은 현장 사정에 따라 변경될 수 있습니다.</div>

  <section>
    <h2>오전</h2>
    <ul>
      <li><time>09:20</time>넙디공원</li>
      <li><time>09:40</time>운남공원</li>
      <li><time>10:00</time>구석말공원</li>
      <li><time>10:10</time>하늘체육공원</li>
      <li><time>10:20</time>별빛·달빛공원</li>
      <li><time>10:40</time>배곶공원</li>
    </ul>
  </section>

  <section>
    <h2>오후</h2>
    <ul>
      <li><time>13:00</time>배곶공원</li>
      <li><time>13:20</time>별빛·달빛공원</li>
      <li><time>13:40</time>하늘체육공원</li>
      <li><time>14:00</time>구석말공원</li>
      <li><time>14:20</time>운남공원</li>
      <li><time>14:40</time>넙디공원</li>
    </ul>
  </section>

  <footer>일정 변경 시 별도로 안내드립니다.</footer>
</main>
</body>
</html>
